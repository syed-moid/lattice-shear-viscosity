[project]
name = "latvisc"
version = "0.1.0"
description = "Lattice shear viscosity in strongly anharmonic ferroelectric oxides from first principles"
readme = "README.md"
authors = [
    { name = "Syed Moid", email = "syedmoid@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "phono3py>=4.3.3",
    "phonopy>=4.3.1",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
